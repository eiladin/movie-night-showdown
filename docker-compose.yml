services:
  showdown:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - poster-cache:/var/cache/mns
    environment:
      # At least one source is required: Jellyfin, TMDB, or both. With none set
      # the app serves its /setup guide and explains what is missing.
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      STREAMING_PROVIDERS: ${STREAMING_PROVIDERS:-}
      TMDB_WATCH_REGION: ${TMDB_WATCH_REGION:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PORT: "8080"
      SESSION_TTL: ${SESSION_TTL:-4h}
      CACHE_DIR: /var/cache/mns
    restart: unless-stopped

volumes:
  poster-cache:
