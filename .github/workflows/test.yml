name: Test

# Push is limited to main so a pull request is tested once, not twice: a push
# to a branch that has an open PR would otherwise fire both triggers for the
# same commit. Tags are excluded because a tag is a release, handled by
# docker-publish.yml, and the commit it points at was already tested here.
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

# The two suites are independent jobs rather than steps in one, so a failure
# names the language that broke and neither waits on the other.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # main.go embeds web/dist, which is a build artifact and is not committed,
      # so a bare checkout cannot compile. The frontend is built and tested by
      # the web job; this placeholder only satisfies the embed directive.
      - name: Stub the embedded frontend
        run: mkdir -p web/dist && touch web/dist/index.html

      # First, because it is the cheapest check and the most irritating to
      # discover after a long job. A bare `gofmt -l` exits 0 even when it lists
      # files, so the result has to be tested rather than relied on.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Configured in .golangci.yml, tuned for bugs over style. Last because it
      # is the slowest step and the least likely to fail.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
